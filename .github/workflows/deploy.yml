name: Deploy to Railway

on:
  push:
    branches: [ "dev" ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
      RAILWAY_ENV: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','gradle.properties','**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build (no tests)
        run: ./gradlew --no-daemon clean bootJar -x test

      # ✅ 설치 경로 고정 + PATH 등록
      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh -s -- --install-dir "$HOME/.railway/bin"
          echo "$HOME/.railway/bin" >> $GITHUB_PATH
          railway --version

      - name: Link Railway Project
        run: railway link --project "$RAILWAY_PROJECT_ID"

      - name: Deploy
        run: railway up --ci -s "$RAILWAY_SERVICE" -e "$RAILWAY_ENV"
