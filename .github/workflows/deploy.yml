name: Deploy to Railway

on:
  push:
    branches: [ "dev" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
      RAILWAY_ENV: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install Railway CLI
        run: npm i -g @railway/cli && railway --version

      # 선택: 상태 확인 (RAILWAY_TOKEN/PROJECT_ID가 적용되는지 확인)
      - name: Whoami / Status
        run: |
          railway whoami || true
          railway status --environment "$RAILWAY_ENV" || true

      # 🚀 배포 (프로젝트 ID는 env에서 자동 인식)
      - name: Deploy
        run: railway up --ci --environment "$RAILWAY_ENV" --service "$RAILWAY_SERVICE"
