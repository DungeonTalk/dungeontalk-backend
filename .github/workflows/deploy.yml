name: Deploy to Railway

on:
  push:
    branches: [ "dev" ]   # 필요 시 변경

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # ✅ GitHub Secrets에 "순수 값"으로 저장되어 있어야 함 (공백/주석/따옴표/개행 X)
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}          # Project Settings > Tokens 의 Project Token
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}# prj_... 형태
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}      # 기대하는 서비스명 (대략 적어도 됨)
      RAILWAY_ENV: production                              # (이미지 기준 prod만 사용)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- 앱 사전 빌드(선택) ---
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','gradle.properties','**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build (skip tests)
        run: ./gradlew --no-daemon clean bootJar -x test
      # --- 앱 빌드 끝 ---

      - name: Setup Node (for Railway CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI & jq
        run: |
          npm i -g @railway/cli
          sudo apt-get update && sudo apt-get install -y jq
          railway --version

      # 🔎 서비스명 자동 해석 (대소문자 무시 매칭)
      - name: Resolve service name
        run: |
          # 프로젝트/토큰은 env 로 자동 인식됨
          railway status --json > status.json

          echo "Available services in project:"
          jq -r '.services[].name' status.json

          WANT="${RAILWAY_SERVICE}"
          FOUND=$(jq -r --arg n "$WANT" '
            .services[] | select((.name==$n) or (ascii_downcase(.name)==ascii_downcase($n))) | .name
          ' status.json | head -n1)

          if [ -z "$FOUND" ]; then
            echo "❌ Service '$WANT' not found in this project."
            echo "👉 위 목록 중 정확한 이름을 GitHub Secrets 의 RAILWAY_SERVICE 로 저장하세요."
            exit 1
          fi

          echo "✅ Resolved service: $FOUND"
          echo "RESOLVED_SERVICE=$FOUND" >> $GITHUB_ENV

      # 🚀 배포 (환경은 production, 서비스는 해석된 이름)
      - name: Deploy to Railway
        run: railway up --ci --environment "$RAILWAY_ENV" --service "$RESOLVED_SERVICE"
