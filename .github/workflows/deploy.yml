name: Deploy to Railway

on:
  push:
    branches: [ "dev" ]   # 필요에 맞게 브랜치 변경

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # 👉 GitHub Secrets/Variables 로부터 주입
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}       # Project Settings > Tokens 의 Project Token
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}  # prj_...  (순수값만)
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}   # 예: "dungeontalk-backend"
      RAILWAY_ENV: production                           # 필요 시 변경

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # (선택) JDK & 로컬 빌드 — Docker 빌드만 쓸거면 삭제해도 됨
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','gradle.properties','**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build (skip tests)
        run: ./gradlew --no-daemon clean bootJar -x test

      # ── Railway CLI 설치 ────────────────────────────────────────────────
      - name: Setup Node (for Railway CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm i -g @railway/cli && railway --version

      # (선택) 현재 토큰/프로젝트 인식 확인
      - name: Who am I / Project check
        run: |
          railway whoami
          railway status || true

      # v3에서는 --project 옵션이 없습니다. env(RAILWAY_PROJECT_ID)를 자동 사용합니다.
      - name: Deploy to Railway
        run: |
          railway up --ci \
            --environment "$RAILWAY_ENV" \
            --service "$RAILWAY_SERVICE"
