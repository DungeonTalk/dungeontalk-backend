name: Deploy to Railway

on:
  push:
    branches: [ "dev" ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
      RAILWAY_ENV: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # (선택) 사전 빌드: 실패 시 원인 파악이 쉬움
      - name: Build locally (skip tests)
        run: ./gradlew --no-daemon clean bootJar -x test

      # Railway CLI (npm)
      - name: Setup Node (for Railway CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm i -g @railway/cli && railway --version

      - name: Link Railway Project
        run: railway link --project "$RAILWAY_PROJECT_ID"

      - name: Deploy to Railway
        run: railway up --ci -s "$RAILWAY_SERVICE" -e "$RAILWAY_ENV"
