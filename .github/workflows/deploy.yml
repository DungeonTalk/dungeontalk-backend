name: Deploy to Railway

on:
  push:
    branches: [ "dev" ]   # 필요 시 변경

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # ✅ GitHub Secrets에 "순수 값"으로 저장돼 있어야 함 (공백/주석/따옴표/개행 X)
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}          # Project Token
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}# prj_... 형태
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}      # 예: dungeontalk-backend
      RAILWAY_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # (선택) 앱 사전 빌드가 필요하면 유지, Docker 빌드만 쓸거면 삭제해도 됨
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','gradle.properties','**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build (skip tests)
        run: ./gradlew --no-daemon clean bootJar -x test

      # ── Railway CLI v3 설치 ────────────────────────────────────────────
      - name: Setup Node (for Railway CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm i -g @railway/cli && railway --version

      # ✅ 프로젝트 링크 (v3: --project 플래그 없음)
      - name: Link Project
        run: railway link "$RAILWAY_PROJECT_ID"

      # (선택) 프로젝트/서비스/환경 상태 체크 — 실패해도 파이프라인 중단 안 함
      - name: Status (non-blocking)
        run: railway status --environment "$RAILWAY_ENV" || true

      # 🚀 배포
      - name: Deploy to Railway
        run: railway up --ci --environment "$RAILWAY_ENV" --service "$RAILWAY_SERVICE"
