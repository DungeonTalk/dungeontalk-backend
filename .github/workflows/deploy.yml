name: Deploy to Railway

on:
  push:
    branches: [ "dev" ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}          # Project Token 권장
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}# prj_xxx...
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}      # 서비스 이름
      RAILWAY_ENV: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # (선택) 사전 빌드 - 실패 원인 파악용
      - name: Build locally (skip tests)
        run: ./gradlew --no-daemon clean bootJar -x test

      # Railway CLI 설치 (npm이 제일 안정적)
      - name: Setup Node (for Railway CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm i -g @railway/cli && railway --version

      # 링크
      - name: Link Railway Project
        run: railway link --project "$RAILWAY_PROJECT_ID"

      # 배포
      - name: Deploy to Railway
        run: railway up --ci --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENV" --service "$RAILWAY_SERVICE"
