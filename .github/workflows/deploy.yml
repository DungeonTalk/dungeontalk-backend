name: Deploy to Railway

on:
  push:
    branches: [ "dev" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
      RAILWAY_ENV: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install Railway CLI
        run: npm i -g @railway/cli && railway --version

      # 🔧 시크릿 값 정규화(주석/개행/공백 제거)
      - name: Normalize secrets
        run: |
          CLEAN_PROJECT_ID="$(printf %s "$RAILWAY_PROJECT_ID" | tr -d '\r' | sed -E 's/#.*$//; s/[[:space:]]+$//; s/^[[:space:]]+//')"
          CLEAN_SERVICE="$(printf %s "$RAILWAY_SERVICE" | tr -d '\r' | sed -E 's/#.*$//; s/[[:space:]]+$//; s/^[[:space:]]+//')"
          echo "CLEAN_PROJECT_ID=$CLEAN_PROJECT_ID" >> $GITHUB_ENV
          echo "CLEAN_SERVICE=$CLEAN_SERVICE" >> $GITHUB_ENV

          echo "PID length: $(printf %s "$CLEAN_PROJECT_ID" | wc -c)"
          echo "SERVICE   : $(printf %s "$CLEAN_SERVICE"    | wc -c)"

      # v3: link는 인자로 projectId만 줍니다(옵션 없음)
      - name: Link Project
        run: railway link "$CLEAN_PROJECT_ID"

      # 선택: 상태 확인(실패해도 파이프라인 계속)
      - name: Status (non-blocking)
        run: railway status --environment "$RAILWAY_ENV" || true

      # 배포
      - name: Deploy
        run: railway up --ci --environment "$RAILWAY_ENV" --service "$CLEAN_SERVICE"
