<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>던전톡 채팅 테스트 (SSR)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg:#f6f7fb; --card:#fff; --txt:#111; --muted:#666; --line:#eee;
      --pri:#667eea; --okbg:#e8f5e9; --ok:#2e7d32; --badbg:#ffebee; --bad:#c62828;
      --me:#e3f2fd; --other:#f3e5f5; --sys:#fff3e0;
    }
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);margin:0;color:var(--txt)}
    .wrap{max-width:1200px;margin:24px auto;padding:0 16px}
    .grid{display:grid;grid-template-columns:340px 1fr;gap:16px}
    .card{background:var(--card);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.08);overflow:hidden}
    .card h2{margin:0;padding:14px 16px;border-bottom:1px solid var(--line);font-size:16px}
    .pad{padding:16px}
    .row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
    label{width:96px;font-size:13px;color:#333}
    input,select,button{padding:10px;border:1px solid #ddd;border-radius:10px;font-size:14px}
    input[type=text]{flex:1}
    button{background:var(--pri);color:#fff;border:0;cursor:pointer}
    button.gray{background:#9aa1b2}
    button.red{background:#d64545}
    .status{padding:10px;border-radius:10px;margin-bottom:10px;font-size:14px}
    .ok{background:var(--okbg);color:var(--ok)}.bad{background:var(--badbg);color:var(--bad)}
    .list{height:520px;overflow:auto;padding:16px}
    .msg{margin:10px 0;padding:10px 12px;border-radius:10px;max-width:76%}
    .me{background:var(--me);margin-left:auto;text-align:right}
    .other{background:var(--other)}
    .sys{background:var(--sys);text-align:center;max-width:100%}
    .meta{font-size:12px;color:var(--muted);margin-top:4px}
    .count{font-weight:700}
    .kvs{font-size:13px;color:#555}
    .presence{border-top:1px dashed var(--line); margin-top:12px; padding-top:12px}
    .presence ul{list-style:none;padding:0;margin:8px 0 0}
    .presence li{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
    .dot{width:10px;height:10px;border-radius:50%;background:#aaa}
    .dot.on{background:#21c581}
    .badge{display:inline-block;padding:5px 10px;border-radius:10px;background:#eef; font-weight:700}
  </style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <div class="card">
      <h2>설정 / 제어</h2>
      <div class="pad">
        <div id="conn" class="status bad">WS 끊김</div>

        <div class="row"><label>닉네임</label><input id="nickname"/></div>
        <div class="row"><label>방 이름</label><input id="roomName" value="테스트 방"/></div>
        <div class="row"><label>Room Type</label><select id="roomType"><option>PLAYER</option><option>GAME</option></select></div>
        <div class="row"><label>Mode</label><select id="mode"><option>SINGLE</option><option selected>MULTI</option></select></div>

        <div class="row">
          <input id="manualRoomId" placeholder="기존 방 ID 붙여넣기"/>
          <button class="gray" onclick="useRoom()">설정</button>
        </div>
        <div class="row">
          <button class="gray" onclick="copyInvite()">초대 링크 복사</button>
          <button class="gray" onclick="loadRoomList()">방 목록 불러오기</button>
        </div>

        <div class="row">
          <button onclick="createRoom()">방 생성</button>
          <button class="gray" onclick="loadMessages()">메시지 로드</button>
        </div>

        <div class="row">
          <button onclick="connectWS()">WS 연결</button>
          <button class="gray" onclick="disconnectWS()">WS 해제</button>
        </div>

        <div class="row">
          <button onclick="joinRoom()">입장</button>
          <button class="red" onclick="leaveRoom()">퇴장</button>
        </div>

        <div class="row kvs">
          <span class="badge">접속자 <span id="cc" class="count">0</span> / <span id="cap" class="count">-</span></span>
        </div>
        <div id="roomInfo" class="kvs" style="margin-top:8px"></div>
        <div id="roomList" style="margin-top:12px;font-size:13px;color:#333"></div>

        <div class="presence">
          <div style="font-weight:700">현재 접속자</div>
          <ul id="presenceList"></ul>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>채팅</h2>
      <div id="list" class="list"></div>
      <div class="pad">
        <div class="row">
          <input id="input" placeholder="메시지를 입력하세요…" onkeypress="if(event.key==='Enter'){sendTalk();}"/>
          <button onclick="sendTalk()">전송</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- deps -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script>
  const DEBUG = true;
  const log = (...a)=> DEBUG && console.log('[CHAT]', ...a);
  const warn = (...a)=> DEBUG && console.warn('[CHAT]', ...a);

  // ===== API / WS PATHS =====
  const WS_ENDPOINT = '/ws-chat';
  const SUB_PATH = id => `/sub/chat/room/${id}`;
  const PUB_PATH = '/pub/chat/send';

  const API_CREATE_ROOM = '/v1/chat/room';
  const API_JOIN_ROOM   = (rid, mid)=> `/v1/chat/room/${rid}/join/${mid}`;
  const API_LEAVE_ROOM  = (rid, mid)=> `/v1/chat/room/${rid}/leave/${mid}`;
  const API_MESSAGES    = (rid, p=0, s=30)=> `/v1/chat/room/${rid}/messages?page=${p}&size=${s}`;
  const API_ROOMS       = '/v1/chat/room';

  // ===== STATE =====
  let stomp=null, subscription=null, roomId=null, member=null, subscribed=false;

  // dedupe for websocket system messages
  const __seenMsgIds = new Set();
  const __seenQueue = [];
  function rememberMsg(id){
    if(!id) return; if(__seenMsgIds.has(id)) return;
    __seenMsgIds.add(id); __seenQueue.push(id);
    if(__seenQueue.length > 500){ const old = __seenQueue.shift(); __seenMsgIds.delete(old); }
  }
  function alreadySeen(id){ return id && __seenMsgIds.has(id); }


  // ===== UTILS =====
  const authHeaders = ()=> {
    const t = localStorage.getItem('authToken');
    return t ? { Authorization: 'Bearer '+t } : {};
  };
  const now = ()=> new Date().toLocaleTimeString();
  const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/\n/g,'<br>');
  const setConn = ok => { const el=document.getElementById('conn'); el.className='status '+(ok?'ok':'bad'); el.textContent=ok?'WS 연결됨':'WS 끊김'; };
  const setCount = n => document.getElementById('cc').textContent=n ?? 0;
  const setCap = n => { const v = (typeof n === 'number') ? (n > 0 ? n : '-') : '-'; document.getElementById('cap').textContent = v; };
  const addRow = (cls, content, meta) => {
    const box=document.getElementById('list');
    const el=document.createElement('div');
    el.className='msg '+cls;
    el.innerHTML=`<div>${content}</div>${meta?`<div class="meta">${meta}</div>`:''}`;
    box.appendChild(el); box.scrollTop=box.scrollHeight;
  };
  const renderPresence = (members=[])=>{
    const ul=document.getElementById('presenceList');
    if(!members.length){ ul.innerHTML='<li style="color:#888">접속자가 없습니다.</li>'; return; }
    ul.innerHTML = members.map(m=>`
      <li><span class="dot on"></span><span>${esc(m.nickname||'익명')}</span><span style="margin-left:auto;color:#999;font-size:12px">${m.memberId}</span></li>
    `).join('');
  };

  // ===== INIT =====
  (function init(){
    const userStr = localStorage.getItem('currentUser');
    const token = localStorage.getItem('authToken');
    if(!userStr || !token){ alert('로그인이 필요합니다.'); location.href='/login-chat-test.html'; return; }
    member = JSON.parse(userStr);
    document.getElementById('nickname').value = member.nickname || (member.id + '님');

    const urlRoomId = new URLSearchParams(location.search).get('roomId');
    if(urlRoomId){ setRoom(urlRoomId); addRow('sys', `기존 방 설정: ${roomId}`, now()); }
    addRow('sys','페이지 로드 완료', now());
  })();

  // ===== ROOM UTILS =====
  function setRoom(id){
    roomId=id;
    document.getElementById('manualRoomId').value=id;
    document.getElementById('roomInfo').textContent=`RoomID=${roomId}`;
  }
  function useRoom(){
    const v=document.getElementById('manualRoomId').value.trim();
    if(!v){ addRow('sys','방 ID를 입력하세요', now()); return; }
    setRoom(v);
    addRow('sys', `기존 방 설정: ${roomId}`, now());
  }
  function copyInvite(){
    if(!roomId){ addRow('sys','먼저 방을 선택/생성하세요', now()); return; }
    const link=`${location.origin}/chat-ssr-test.html?roomId=${encodeURIComponent(roomId)}`;
    navigator.clipboard.writeText(link).then(()=>addRow('sys','초대 링크 복사됨', now()));
  }

  async function loadRoomList(){
    try{
      const res = await fetch(API_ROOMS, { headers: authHeaders() });
      if(!res.ok) throw new Error(await res.text());
      const rs = await res.json();
      const rooms = rs.data || [];
      const box = document.getElementById('roomList');
      if(!rooms.length){ box.innerHTML = '<div>열린 방이 없습니다.</div>'; return; }
      box.innerHTML = rooms.map(r=>{
        const name = (r.roomName || '(이름없음)');
        const info = `${r.id} · ${(r.roomType||'')}/${(r.mode||'')}`;
        return `<div style="border:1px solid #eee;padding:8px;border-radius:10px;margin-bottom:6px">
          <div><b>${esc(name)}</b></div>
          <div style="font-size:12px;color:#666">ID: ${esc(info)}</div>
          <div style="margin-top:6px"><button onclick="joinExisting('${r.id}')">참가</button></div>
        </div>`;
      }).join('');
    }catch(e){ addRow('sys','방 목록 실패: '+e.message, now()); }
  }
  async function joinExisting(id){ setRoom(id); await ensureConnected(); await joinRoom(); }

  // ===== CREATE ROOM =====
  async function createRoom(){
    const body = {
      roomName: document.getElementById('roomName').value.trim() || '테스트 방',
      roomType: document.getElementById('roomType').value,
      mode: document.getElementById('mode').value,
      participantIds: [member.id]
    };
    try{
      const res = await fetch(API_CREATE_ROOM, {
        method:'POST',
        headers:Object.assign({'Content-Type':'application/json'}, authHeaders()),
        body: JSON.stringify(body)
      });
      if(!res.ok) throw new Error(await res.text());
      const rs = await res.json(); const data = rs.data || rs;
      setRoom(data.id);
      addRow('sys', `방 생성 성공: ${roomId}`, now());
    }catch(e){ addRow('sys','방 생성 실패: '+e.message, now()); }
  }

  // ===== WS =====
  async function ensureConnected(){
    return new Promise((resolve)=>{
      if(stomp && stomp.connected){ subscribed = true; return resolve(); }
      if(!roomId){ addRow('sys','roomId가 없습니다', now()); return resolve(); }

      const token = localStorage.getItem('authToken');
      const url = `${WS_ENDPOINT}?token=${encodeURIComponent(token)}&roomId=${encodeURIComponent(roomId)}`;

      const sock = new SockJS(url);
      stomp = Stomp.over(sock);
      stomp.debug = s=> DEBUG && console.debug('[STOMP]', s);

      stomp.connect({}, function(){
        setConn(true);
        try{ if(subscription) subscription.unsubscribe(); }catch(_){}
        subscription = stomp.subscribe(SUB_PATH(roomId), function(msg){
          let p = msg.body;
          try{ p = JSON.parse(msg.body); }catch(_){}
          handleIncoming(p);
        });
        subscribed = true;
        addRow('sys','WS 연결 성공', now());
        resolve();
      }, function(){
        setConn(false); addRow('sys','WS 연결 실패', now()); resolve();
      });
    });
  }
  function connectWS(){ ensureConnected(); }
  function disconnectWS(){
    try{ if(subscription) subscription.unsubscribe(); }catch(_){}
    try{ if(stomp) stomp.disconnect(()=>setConn(false)); }catch(_){}
  }

  // ===== JOIN / LEAVE =====
  async function joinRoom(){
    if(!roomId) return addRow('sys','roomId가 없습니다', now());
    if(!subscribed) await ensureConnected();
    try{
      const r = await fetch(API_JOIN_ROOM(roomId, member.id), { method:'POST', headers: authHeaders() });
      if(!r.ok) { const t=await r.text(); warn('REST join 실패(무시 가능):', t); }
    }catch(e){ warn('REST join 에러(무시 가능):', e); }
    stomp && stomp.send(PUB_PATH, {}, JSON.stringify({ roomId, senderId: member.id, content:'', type:'JOIN' }));
    // (muted) client join log removed
  }

  async function leaveRoom(){
    if(!roomId) return;
    try{
      const r = await fetch(API_LEAVE_ROOM(roomId, member.id), { method:'DELETE', headers: authHeaders() });
      if(!r.ok){ const t=await r.text(); warn('REST leave 실패(무시 가능):', t); }
    }catch(e){ warn('REST leave 에러(무시 가능):', e); }
    stomp && stomp.send(PUB_PATH, {}, JSON.stringify({ roomId, senderId: member.id, content:'', type:'LEAVE' }));
    addRow('sys','방 퇴장 요청 전송', now());
  }

  // ===== TALK / MESSAGES =====
  function sendTalk(){
    const input = document.getElementById('input');
    const text = (input.value||'').trim();
    if(!text || !stomp || !stomp.connected || !roomId) return;
    stomp.send(PUB_PATH, {}, JSON.stringify({ roomId, senderId: member.id, content: text, type: 'TALK' }));
    input.value = '';
  }

  async function loadMessages(){
    if(!roomId) return addRow('sys','방을 먼저 선택/생성하세요', now());
    try{
      const res = await fetch(API_MESSAGES(roomId, 0, 30), { headers: authHeaders() });
      if(!res.ok) throw new Error(await res.text());
      const rs = await res.json();
      const items = (rs.data && rs.data.content) ? rs.data.content : (Array.isArray(rs) ? rs : []);
      addRow('sys', `최근 ${items.length}건 로드`, now());
      items.slice().reverse().forEach(function(m){
        const who = (m.senderId===member.id)?'me':'other';
        const nick = m.senderNickname || m.senderNickName || (m.senderId===member.id?'나':'익명');
        const text = m.message || m.content || '';
        const when = new Date(m.createdAt).toLocaleTimeString();
        addRow(who, esc(text), `${esc(nick)} · ${when}`);
      });
    }catch(e){ addRow('sys','메시지 로드 실패: '+e.message, now()); }
  }

  // ===== INCOMING =====
  function handleIncoming(p){
    if(typeof p === 'string'){ addRow('sys', esc(p), now()); return; }

    if(p && typeof p==='object' && ('connectedCount' in p) && ('eventType' in p)){
      setCount(p.connectedCount);
      setCap(p.maxCapacity);
      renderPresence(p.members || []);
      /* muted JOIN logs */
      // if(p.eventType === 'LEAVE'){ addRow('sys', '누군가 퇴장했습니다.', now()); }
      // if(p.eventType === 'LEAVE_IGNORED'){ addRow('sys', '중복 퇴장 요청이 무시되었습니다.', now()); }
      if(p.eventType === 'CAPACITY_UPDATED'){ addRow('sys', '정원이 변경되었습니다.', now()); }
      return;
    }

    const t = (p.type || p.messageType || '').toUpperCase();
    if(t === 'CONNECTED_COUNT'){ setCount(p.connectedCount ?? 0); return; }
    if(t === 'PRESENCE'){ setCount(p.connectedCount ?? 0); renderPresence(p.members || []); return; }

    const text = p.content || p.message || '';
    if(t === 'TALK'){
      const who  = (p.senderId===member.id)?'me':'other';
      const nick = p.senderNickname || p.senderNickName || '익명';
      addRow(who, esc(text), `${esc(nick)} · ${now()}`);
    }else if(t === 'JOIN' || t === 'LEAVE'){
      const mid = p.messageId || p.id; // support both DTO/Response
      if(alreadySeen(mid)) return; // dedupe repeated system msg
      rememberMsg(mid);
      addRow('sys', esc(text), now());
    }else{
      addRow('sys', esc(JSON.stringify(p)), now());
    }
  }

  // ===== UNLOAD =====
  window.addEventListener('beforeunload', function(){
    try{
      if(roomId && member && member.id){
        navigator.sendBeacon(API_LEAVE_ROOM(roomId, member.id));
      }
    }catch(_){}
    try{ if(subscription) subscription.unsubscribe(); if(stomp) stomp.disconnect(()=>{}); }catch(_){}
  });
</script>
</body>
</html>
