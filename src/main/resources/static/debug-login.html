<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 디버깅</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f5f5f5; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>로그인 프로세스 디버깅</h1>
    
    <div class="section">
        <h2>1단계: 로그인</h2>
        <button onclick="testLogin()">testuser1로 로그인 시도</button>
        <div id="login-result"></div>
    </div>
    
    <div class="section">
        <h2>2단계: 토큰 확인</h2>
        <button onclick="checkToken()">저장된 토큰 확인</button>
        <div id="token-result"></div>
    </div>
    
    <div class="section">
        <h2>3단계: /v1/member/me 테스트</h2>
        <button onclick="testMe()">사용자 정보 조회</button>
        <div id="me-result"></div>
    </div>
    
    <div class="section">
        <h2>4단계: 페이지 이동</h2>
        <button onclick="testRedirect('/game')">게임 페이지로 이동</button>
        <button onclick="testRedirect('/chat')">채팅 페이지로 이동</button>
        <button onclick="testRedirect('/login')">로그인 페이지로 이동</button>
        <div id="redirect-result"></div>
    </div>

    <script>
        function log(elementId, message, isError = false) {
            const element = document.getElementById(elementId);
            const className = isError ? 'error' : 'success';
            element.innerHTML = `<p class="${className}">${message}</p>`;
        }

        async function testLogin() {
            try {
                log('login-result', '로그인 시도 중...');
                
                const response = await fetch('/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'testuser1',
                        password: 'password123'
                    })
                });
                
                const text = await response.text();
                console.log('Response status:', response.status);
                console.log('Response text:', text);
                
                if (response.ok) {
                    const result = JSON.parse(text);
                    console.log('Parsed result:', result);
                    
                    // 토큰 저장
                    if (result.data && result.data.accessToken) {
                        localStorage.setItem('authToken', result.data.accessToken);
                        localStorage.setItem('currentUser', JSON.stringify({
                            id: result.data.memberId,
                            nickname: 'testuser1님'
                        }));
                        log('login-result', '로그인 성공! 토큰이 저장되었습니다.<pre>' + JSON.stringify(result, null, 2) + '</pre>');
                    } else {
                        log('login-result', '로그인 응답에 토큰이 없습니다.<pre>' + text + '</pre>', true);
                    }
                } else {
                    log('login-result', `로그인 실패 (${response.status}): <pre>${text}</pre>`, true);
                }
            } catch (error) {
                console.error('Login error:', error);
                log('login-result', '로그인 중 오류: ' + error.message, true);
            }
        }

        function checkToken() {
            const token = localStorage.getItem('authToken');
            const user = localStorage.getItem('currentUser');
            
            if (token) {
                log('token-result', `토큰 발견됨:<br>Token: ${token.substring(0, 50)}...<br>User: ${user}`);
            } else {
                log('token-result', '저장된 토큰이 없습니다.', true);
            }
        }

        async function testMe() {
            const token = localStorage.getItem('authToken');
            
            if (!token) {
                log('me-result', '토큰이 없습니다. 먼저 로그인하세요.', true);
                return;
            }
            
            // JWT 토큰이 있으면 디버그 정보 표시
            log('me-result', '토큰 확인 완료: ' + token.substring(0, 20) + '...');
        }

        function testRedirect(path) {
            log('redirect-result', `${path}로 이동 시도 중...`);
            console.log('Attempting to redirect to:', path);
            
            // 현재 URL 확인
            console.log('Current URL:', window.location.href);
            
            // 리다이렉트 시도
            try {
                window.location.href = path;
                // 리다이렉트가 즉시 일어나지 않으면 메시지 표시
                setTimeout(() => {
                    log('redirect-result', '리다이렉트가 차단되었거나 실패했을 수 있습니다.', true);
                }, 1000);
            } catch (error) {
                console.error('Redirect error:', error);
                log('redirect-result', '리다이렉트 오류: ' + error.message, true);
            }
        }
    </script>
</body>
</html>
