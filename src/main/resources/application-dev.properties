# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

# HikariCP Connection Pool Settings (Performance Optimization)
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.pool-name=DungeonTalkHikariCP

# MongoDB - 인증 없이 사용
spring.data.mongodb.host=${SPRING_DATA_MONGODB_HOST}
spring.data.mongodb.port=${SPRING_DATA_MONGODB_PORT}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE}


# MongoDB 인증 설정
spring.data.mongodb.username=${SPRING_DATA_MONGODB_USERNAME}
spring.data.mongodb.password=${SPRING_DATA_MONGODB_PASSWORD}
spring.data.mongodb.authentication-database=${SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE}

# Redis (Valkey) - ValkeyConfig? ?? ??
spring.session.store-type=${SPRING_SESSION_STORE_TYPE}
spring.data.session.host=${SPRING_DATA_SESSION_HOST}
spring.data.session.port=${SPRING_DATA_SESSION_PORT}

spring.cache.type=${SPRING_CACHE_TYPE}
spring.redis.cache.host=${SPRING_REDIS_CACHE_HOST}
spring.redis.cache.port=${SPRING_REDIS_CACHE_PORT}

# Lettuce Connection Pool Settings (Performance Optimization)
spring.data.redis.lettuce.pool.max-active=50
spring.data.redis.lettuce.pool.max-idle=20
spring.data.redis.lettuce.pool.min-idle=10
spring.data.redis.lettuce.pool.max-wait=3000ms
spring.data.redis.timeout=5000ms

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_HIBERNATE_FORMAT_SQL}

# JWT
jwt.secret=${JWT_SECRET}
jwt.accessexpiration=${JWT_ACCESS_EXPIRATION}
jwt.refreshexpiration=${JWT_REFRESH_EXPIRATION}

# logging.level.org.springframework.data.redis=TRACE

# 로그 레벨 설정 (운영 환경 고려)
logging.level.org.com.dungeontalk.global.filter=WARN
logging.level.org.com.dungeontalk.domain.aichat.service.AiGameMessageService=INFO
logging.level.org.com.dungeontalk.domain.chat.service.ChatMessageService=INFO
logging.level.root=INFO

# Kafka log level
logging.level.org.com.dungeontalk.global.kafka=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=WARN

# AI Service Configuration
ai.service.url=http://localhost:8001
ai.service.timeout=60000
ai.service.connect.timeout=10000

# AI Chat Module Settings
aichat.session.timeout-seconds=3600
aichat.session.turn-lock-timeout-seconds=300
aichat.context.message-count=5
aichat.websocket.destination-prefix=/sub/aichat/room/
aichat.message-order.turn-start=0
aichat.message-order.turn-end=9999
aichat.message-order.error=9998

# DevTools ?? - ?? ??? ????
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Session timeout (30분 = 1800초)
server.servlet.session.timeout=30m

# Chat Module Settings
chat.room.default-max-capacity=3

# Cookie settings for development (HTTP)
cookie.secure=false

# Logging for debugging
logging.level.org.com.dungeontalk.global.security=DEBUG

# Profanity Filter Settings
profanity-filter.enabled=true
profanity-filter.mode=FILTER
profanity-filter.replacement=***
profanity-filter.ignore-spaces=true
profanity-filter.filter-ai-chat=true
profanity-filter.filter-player-chat=true
profanity-filter.filter-admin-messages=false

# Brute Force Protection (개발 환경 완화)
brute-force.enabled=true
brute-force.max-attempts=10
brute-force.delay-enabled=false
brute-force.cooldown-minutes=1

# ======================= Kafka =======================

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=1
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=dungeontalk-chat-consumer
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=org.com.dungeontalk.*

# Topic
kafka.topics.chat.regular=dungeontalk.chat.regular
