server.port=${PORT:8080}

# Postgres (Railway Reference Variables)
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# MongoDB (Railway Reference)
spring.data.mongodb.uri=${MONGO_URL}

# Redis / Valkey (Railway Reference)
spring.data.redis.url=${REDIS_URL}
spring.session.store-type=redis
spring.cache.type=redis

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT (Railway Variables?? ??)
jwt.secret=${JWT_SECRET}
jwt.accessexpiration=${JWT_ACCESS_EXPIRATION:604800000}
jwt.refreshexpiration=${JWT_REFRESH_EXPIRATION:604800000}

# === aichat ===
aichat.session.timeout-seconds=3600
aichat.session.turn-lock-timeout-seconds=300
aichat.context.message-count=5
aichat.websocket.destination-prefix=/sub/aichat/room/
aichat.message-order.turn-start=0
aichat.message-order.turn-end=9999
aichat.message-order.error=9998

# Chat Module Settings
chat.room.default-max-capacity=3

# Profanity Filter Settings
profanity-filter.enabled=true
profanity-filter.mode=FILTER
profanity-filter.replacement=***
profanity-filter.ignore-spaces=true
profanity-filter.filter-ai-chat=true
profanity-filter.filter-player-chat=true
profanity-filter.filter-admin-messages=false

# AI health check
management.endpoints.web.exposure.include=health,info
