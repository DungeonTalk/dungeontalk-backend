# server
server.port=${PORT:8080}

# --- PostgreSQL (RDS) ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# --- MongoDB (Atlas) ---
spring.data.mongodb.uri=${MONGODB_URI}

# --- Redis / Valkey (Session: ElastiCache) ---
spring.session.store-type=${SPRING_SESSION_STORE_TYPE:redis}
spring.data.session.host=${SESSION_REDIS_HOST}
spring.data.session.port=${SESSION_REDIS_PORT:6379}
spring.data.redis.ssl.enabled=${SESSION_REDIS_SSL_ENABLED:true}

# --- Redis / Valkey (Cache: EC2 local) ---
spring.cache.type=${SPRING_CACHE_TYPE:redis}
spring.redis.cache.host=${CACHE_REDIS_HOST:host.docker.internal}
spring.redis.cache.port=${CACHE_REDIS_PORT:6379}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.accessexpiration=${JWT_ACCESS_EXPIRATION:604800000}
jwt.refreshexpiration=${JWT_REFRESH_EXPIRATION:604800000}

# === aichat ===
aichat.session.timeout-seconds=${AICHAT_SESSION_TIMEOUT_SECONDS:3600}
aichat.session.turn-lock-timeout-seconds=${AICHAT_TURN_LOCK_TIMEOUT_SECONDS:300}
aichat.context.message-count=${AICHAT_CONTEXT_MESSAGE_COUNT:5}
aichat.websocket.destination-prefix=${AICHAT_WEBSOCKET_DESTINATION_PREFIX:/sub/aichat/room/}
aichat.message-order.turn-start=${AICHAT_MESSAGE_ORDER_TURN_START:0}
aichat.message-order.turn-end=${AICHAT_MESSAGE_ORDER_TURN_END:9999}
aichat.message-order.error=${AICHAT_MESSAGE_ORDER_ERROR:9998}

# Chat Module Settings
chat.room.default-max-capacity=${CHAT_ROOM_DEFAULT_MAX_CAPACITY:3}

# Profanity Filter Settings
profanity-filter.enabled=${PROFANITY_FILTER_ENABLED:true}
profanity-filter.mode=${PROFANITY_FILTER_MODE:FILTER}
profanity-filter.replacement=${PROFANITY_FILTER_REPLACEMENT:***}
profanity-filter.ignore-spaces=${PROFANITY_FILTER_IGNORE_SPACES:true}
profanity-filter.filter-ai-chat=${PROFANITY_FILTER_FILTER_AI_CHAT:true}
profanity-filter.filter-player-chat=${PROFANITY_FILTER_FILTER_PLAYER_CHAT:true}
profanity-filter.filter-admin-messages=${PROFANITY_FILTER_FILTER_ADMIN_MESSAGES:false}

# Actuator
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}

# AI Service Configuration
ai.service.url=${AI_SERVICE_URI}
ai.service.timeout=${AI_SERVICE_TIMEOUT}
ai.service.connect.timeout=${AI_SERVICE_CONNECT_TIMEOUT}