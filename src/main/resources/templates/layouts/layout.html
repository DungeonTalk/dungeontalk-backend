<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE | DungeonTalk">DungeonTalk</title>
    
    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        secondary: {
                            50: '#faf5ff',
                            100: '#f3e8ff',
                            200: '#e9d5ff',
                            300: '#d8b4fe',
                            400: '#c084fc',
                            500: '#a855f7',
                            600: '#9333ea',
                            700: '#7e22ce',
                            800: '#6b21a8',
                            900: '#581c87',
                        },
                        dungeon: {
                            50: '#fef3c7',
                            100: '#fee68a',
                            200: '#fcd34d',
                            300: '#fbbf24',
                            400: '#f59e0b',
                            500: '#d97706',
                            600: '#b45309',
                            700: '#92400e',
                            800: '#78350f',
                            900: '#451a03',
                        }
                    },
                    fontFamily: {
                        sans: ['Pretendard', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(10px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <!-- Custom CSS -->
    <style>
        [x-cloak] { display: none !important; }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            @apply bg-gray-100 dark:bg-gray-800;
        }
        
        ::-webkit-scrollbar-thumb {
            @apply bg-gray-400 dark:bg-gray-600 rounded-full;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            @apply bg-gray-500 dark:bg-gray-500;
        }
    </style>
    
    <!-- Additional head content -->
    <th:block layout:fragment="head"></th:block>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col">
    <!-- 디버깅용: 인증 정보 출력 (필요시 주석 해제) -->
    <!--<div th:if="${#authentication != null and #authentication.authenticated}"
         class="fixed top-0 right-0 bg-yellow-100 dark:bg-yellow-900 border border-yellow-300 dark:border-yellow-700 p-2 text-xs z-50 rounded-bl-lg">
        <div class="text-yellow-800 dark:text-yellow-200">
            <strong>🔐 인증됨:</strong> <span th:text="${#authentication.name}">사용자</span><br>
            <strong>권한:</strong> <span th:text="${#authentication.authorities}">권한</span>
        </div>
    </div>
    <th:block layout:fragment="debug-auth"></th:block-->
    
    <!-- Navigation -->
    <nav class="bg-white dark:bg-gray-800 shadow-lg sticky top-0 z-50" x-data="{ mobileMenuOpen: false }">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex items-center">
                    <a href="/" class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-gradient-to-br from-primary-500 to-secondary-500 rounded-lg flex items-center justify-center">
                            <span class="text-white font-bold text-xl">D</span>
                        </div>
                        <span class="font-bold text-xl">DungeonTalk</span>
                    </a>
                </div>
                
                <!-- Desktop Navigation -->
                <div class="hidden md:flex items-center space-x-8">
                    <a href="/" class="hover:text-primary-600 dark:hover:text-primary-400 transition-colors">홈</a>
                    <a href="/chat" class="hover:text-primary-600 dark:hover:text-primary-400 transition-colors">채팅</a>
                    
                    <div class="flex items-center space-x-4">
                        <!-- Dark mode toggle -->
                        <button @click="document.documentElement.classList.toggle('dark')" 
                                class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                            <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                      d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                            </svg>
                            <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                      d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                            </svg>
                        </button>
                        
                        <!-- User menu -->
                        <div class="relative" x-data="{ userMenuOpen: false }" 
                             th:if="${#authentication != null and #authentication.principal != null and #authentication.principal != 'anonymousUser'}">
                            <button @click="userMenuOpen = !userMenuOpen" 
                                    class="flex items-center space-x-2 p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                                <div class="w-8 h-8 bg-gradient-to-br from-primary-400 to-secondary-400 rounded-full flex items-center justify-center">
                                    <span class="text-white text-sm font-semibold" th:text="${#authentication.principal.nickname != null ? #strings.substring(#authentication.principal.nickname, 0, 1).toUpperCase() : 'U'}">U</span>
                                </div>
                                <span class="text-sm font-medium" th:text="${#authentication.principal.nickname != null ? #authentication.principal.nickname : '사용자'}">사용자</span>
                            </button>
                            
                            <div x-show="userMenuOpen" 
                                 @click.away="userMenuOpen = false"
                                 x-transition:enter="transition ease-out duration-100"
                                 x-transition:enter-start="transform opacity-0 scale-95"
                                 x-transition:enter-end="transform opacity-100 scale-100"
                                 x-transition:leave="transition ease-in duration-75"
                                 x-transition:leave-start="transform opacity-100 scale-100"
                                 x-transition:leave-end="transform opacity-0 scale-95"
                                 class="absolute right-0 mt-2 w-48 rounded-lg shadow-lg bg-white dark:bg-gray-800 ring-1 ring-black ring-opacity-5">
                                <div class="py-1">
                                    <a href="/profile" class="block px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-700">프로필</a>
                                    <a href="/settings" class="block px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-700">설정</a>
                                    <hr class="my-1 border-gray-200 dark:border-gray-700">
                                    <button hx-post="/v1/auth/server-logout" 
                                            hx-trigger="click"
                                            hx-on::after-request="window.location.href='/'"
                                            class="block w-full text-left px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-700">로그아웃</button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Login button for guests -->
                        <a th:unless="${#authentication != null and #authentication.principal != null and #authentication.principal != 'anonymousUser'}" 
                           href="/login" 
                           class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors">
                            로그인
                        </a>
                    </div>
                </div>
                
                <!-- Mobile menu button -->
                <button @click="mobileMenuOpen = !mobileMenuOpen" 
                        class="md:hidden p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path x-show="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        <path x-show="mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Mobile menu -->
        <div x-show="mobileMenuOpen" 
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 -translate-y-2"
             x-transition:enter-end="opacity-100 translate-y-0"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="opacity-100 translate-y-0"
             x-transition:leave-end="opacity-0 -translate-y-2"
             class="md:hidden bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700">
            <div class="px-4 py-2 space-y-1">
                <a href="/" class="block py-2 hover:text-primary-600 dark:hover:text-primary-400">홈</a>
                <a href="/chat" class="block py-2 hover:text-primary-600 dark:hover:text-primary-400">채팅</a>
                <div th:if="${#authentication != null and #authentication.principal != null and #authentication.principal != 'anonymousUser'}" 
                     class="pt-2 border-t border-gray-200 dark:border-gray-700">
                    <a href="/profile" class="block py-2 hover:text-primary-600 dark:hover:text-primary-400">프로필</a>
                    <a href="/settings" class="block py-2 hover:text-primary-600 dark:hover:text-primary-400">설정</a>
                    <button hx-post="/v1/auth/server-logout" 
                            hx-trigger="click"
                            hx-on::after-request="window.location.href='/'"
                            class="block w-full text-left py-2 hover:text-primary-600 dark:hover:text-primary-400">로그아웃</button>
                </div>
                <div th:unless="${#authentication != null and #authentication.principal != null and #authentication.principal != 'anonymousUser'}" 
                     class="pt-2">
                    <a href="/login" class="block py-2 text-primary-600 font-medium">로그인</a>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Main Content -->
    <main class="flex-grow">
        <div layout:fragment="content"></div>
    </main>
    
    <!-- Footer -->
    <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 mt-auto">
        <div class="container mx-auto px-4 py-8">
            <div class="text-center text-sm text-gray-600 dark:text-gray-400">
                <p>&copy; 2025 DungeonTalk. All rights reserved.</p>
            </div>
        </div>
    </footer>
    
    <!-- Global Alpine.js stores -->
    <script>
        document.addEventListener('alpine:init', () => {
            // Global user store
            Alpine.store('user', {
                data: null,
                isAuthenticated: false,
                
                init() {
                    // Initialize from Thymeleaf data if available
                    const authData = document.querySelector('#auth-data');
                    if (authData) {
                        this.data = JSON.parse(authData.textContent);
                        this.isAuthenticated = true;
                    }
                },
                
                login(userData) {
                    this.data = userData;
                    this.isAuthenticated = true;
                },
                
                logout() {
                    this.data = null;
                    this.isAuthenticated = false;
                }
            });
            
            // Global notification store
            Alpine.store('notifications', {
                items: [],
                
                add(message, type = 'info', duration = 5000) {
                    const id = Date.now();
                    this.items.push({ id, message, type });
                    
                    if (duration > 0) {
                        setTimeout(() => this.remove(id), duration);
                    }
                },
                
                remove(id) {
                    this.items = this.items.filter(item => item.id !== id);
                },
                
                success(message, duration) {
                    this.add(message, 'success', duration);
                },
                
                error(message, duration) {
                    this.add(message, 'error', duration);
                },
                
                warning(message, duration) {
                    this.add(message, 'warning', duration);
                }
            });
        });
    </script>
    
    <!-- Authentication data for Alpine.js -->
    <script th:if="${#authentication != null and #authentication.principal != null and #authentication.principal != 'anonymousUser'}" 
            id="auth-data" 
            type="application/json" 
            th:text="${#authentication.principal.nickname}">
    </script>
    
    <!-- Notification container -->
    <div class="fixed top-20 right-4 z-50 space-y-2" x-data>
        <template x-for="notification in $store.notifications.items" :key="notification.id">
            <div x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 transform translate-x-full"
                 x-transition:enter-end="opacity-100 transform translate-x-0"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100 transform translate-x-0"
                 x-transition:leave-end="opacity-0 transform translate-x-full"
                 :class="{
                     'bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200': notification.type === 'success',
                     'bg-red-100 dark:bg-red-900 text-red-800 dark:text-red-200': notification.type === 'error',
                     'bg-yellow-100 dark:bg-yellow-900 text-yellow-800 dark:text-yellow-200': notification.type === 'warning',
                     'bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200': notification.type === 'info'
                 }"
                 class="p-4 rounded-lg shadow-lg flex items-center space-x-3 min-w-[300px]">
                <span x-text="notification.message"></span>
                <button @click="$store.notifications.remove(notification.id)" 
                        class="ml-auto hover:opacity-70">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </template>
    </div>
    
    <!-- Authentication and navigation handling -->
    <script>

        // 로그아웃 처리 함수 - window 객체에 할당하여 전역에서 사용 가능하게 함
        window.handleLogout = function() {
            // 로딩 알림 표시
            if (typeof Alpine !== 'undefined' && Alpine.store && Alpine.store('notifications')) {
                Alpine.store('notifications').add('로그아웃 중...', 'info', 2000);
            }
            
            // 로컬 스토리지에서 토큰 제거
            localStorage.removeItem('accessToken');
            localStorage.removeItem('refreshToken');
            
            // 세션 스토리지에서 토큰 제거
            sessionStorage.removeItem('accessToken');
            sessionStorage.removeItem('refreshToken');
            
            // Alpine.js 스토어에서 사용자 정보 제거
            if (typeof Alpine !== 'undefined' && Alpine.store && Alpine.store('user')) {
                Alpine.store('user').logout();
            }
            
            // 폼을 동적으로 생성하여 서버에 로그아웃 요청
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/v1/auth/server-logout';
            
            // Authorization 헤더 대신 hidden input으로 토큰 전송
            const accessToken = localStorage.getItem('accessToken') || sessionStorage.getItem('accessToken');
            if (accessToken) {
                const tokenInput = document.createElement('input');
                tokenInput.type = 'hidden';
                tokenInput.name = 'accessToken';
                tokenInput.value = accessToken;
                form.appendChild(tokenInput);
            }
            
            document.body.appendChild(form);
            form.submit();
        }
    </script>
    
    <!-- Additional scripts -->
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
