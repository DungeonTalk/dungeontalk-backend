<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>게임 (HTMX) - DungeonTalk</title>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/ws.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/sse.js"></script>
</head>
<body>
<div layout:fragment="content">
    <div class="container mx-auto px-4 py-6">
        
        <!-- 게임 상태 (서버에서 자동 업데이트) -->
        <div id="game-status" 
             hx-get="/api/game/status" 
             hx-trigger="load, every 5s"
             class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 mb-6">
            <!-- 서버에서 렌더링된 상태가 여기 표시 -->
            <div th:replace="~{fragments/game-status :: status}"></div>
        </div>

        <!-- 세계관 선택 (HTMX로 간소화) -->
        <div id="world-selection" class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 mb-6">
            <h2 class="text-2xl font-bold mb-6">🌍 세계관 선택</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div th:each="world : ${worlds}" 
                     hx-post="/api/game/select-world"
                     hx-vals='{"worldId": "[[${world.id}]]"}'
                     hx-target="#selected-world"
                     hx-swap="innerHTML"
                     class="cursor-pointer bg-gray-50 dark:bg-gray-700 rounded-xl p-6 transition-all hover:transform hover:-translate-y-1 hover:shadow-xl">
                    <h3 class="text-xl font-bold mb-3">
                        <span th:text="${world.worldName}">세계관</span>
                    </h3>
                    <p class="text-gray-600 dark:text-gray-400">
                        경험치: <strong th:text="${world.clearExp}">0</strong> EXP
                    </p>
                </div>
            </div>
            
            <div id="selected-world" class="text-center">
                <!-- 선택된 세계관 정보가 여기 표시 -->
            </div>
            
            <button hx-post="/api/game/start-matching" 
                    hx-target="#game-container"
                    hx-swap="innerHTML"
                    hx-confirm="매칭을 시작하시겠습니까?"
                    class="w-full px-8 py-3 bg-primary-600 hover:bg-primary-700 text-white rounded-full font-bold">
                매칭 시작
            </button>
        </div>

        <!-- 게임 플레이 영역 (WebSocket으로 실시간 통신) -->
        <div id="game-container" style="display:none;">
            <!-- WebSocket 연결 -->
            <div hx-ext="ws" ws-connect="/ws-game">
                
                <!-- 15분 타이머 (SSE로 서버에서 푸시) -->
                <div hx-ext="sse" sse-connect="/api/game/timer" class="mb-6">
                    <div class="bg-gradient-to-r from-purple-50 to-blue-50 rounded-xl p-6">
                        <h2 class="text-2xl font-bold mb-4">⏰ TRPG 타이머</h2>
                        <div sse-swap="timer" class="text-4xl font-mono text-center">
                            15:00
                        </div>
                        <div sse-swap="phase" class="text-center mt-2">
                            시작 단계
                        </div>
                    </div>
                </div>
                
                <!-- AI 채팅 -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg overflow-hidden">
                        <div class="p-4 bg-green-50 dark:bg-green-900/20">
                            <h3 class="font-bold">🤖 AI 게임 마스터</h3>
                        </div>
                        
                        <!-- 메시지 영역 (WebSocket으로 자동 업데이트) -->
                        <div id="ai-messages" class="h-96 overflow-y-auto p-4">
                            <!-- WebSocket 메시지가 여기 추가됨 -->
                        </div>
                        
                        <!-- 메시지 전송 폼 -->
                        <form ws-send class="p-4 border-t">
                            <input type="hidden" name="type" value="ai_message">
                            <div class="flex gap-2">
                                <input name="content" 
                                       type="text" 
                                       placeholder="AI에게 행동을 입력..."
                                       class="flex-1 px-4 py-2 border rounded-full">
                                <button type="submit" 
                                        class="px-6 py-2 bg-green-600 text-white rounded-full">
                                    전송
                                </button>
                            </div>
                        </form>
                    </div>
                    
                    <!-- 플레이어 채팅 -->
                    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg overflow-hidden">
                        <div class="p-4 bg-blue-50 dark:bg-blue-900/20">
                            <h3 class="font-bold">👥 플레이어 채팅</h3>
                        </div>
                        
                        <div id="player-messages" class="h-96 overflow-y-auto p-4">
                            <!-- WebSocket 메시지가 여기 추가됨 -->
                        </div>
                        
                        <form ws-send class="p-4 border-t">
                            <input type="hidden" name="type" value="player_message">
                            <div class="flex gap-2">
                                <input name="content" 
                                       type="text" 
                                       placeholder="플레이어들과 대화..."
                                       class="flex-1 px-4 py-2 border rounded-full">
                                <button type="submit" 
                                        class="px-6 py-2 bg-primary-600 text-white rounded-full">
                                    전송
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <!-- 게임 나가기 -->
                <button hx-post="/api/game/leave"
                        hx-confirm="정말로 게임을 나가시겠습니까?"
                        class="mt-6 px-6 py-3 bg-red-600 text-white rounded-lg">
                    게임 나가기
                </button>
            </div>
        </div>
        
        <!-- 캐릭터 정보 모달 (HTMX로 로드) -->
        <div id="character-modal" 
             hx-get="/api/character/info" 
             hx-trigger="showCharacter from:body"
             hx-swap="innerHTML">
            <!-- 캐릭터 정보가 여기 로드됨 -->
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
<script>
// 최소한의 JavaScript만 사용
document.body.addEventListener('htmx:wsOpen', function(evt) {
    console.log('WebSocket 연결됨');
    document.getElementById('game-container').style.display = 'block';
});

document.body.addEventListener('htmx:wsMessage', function(evt) {
    const message = JSON.parse(evt.detail.message);
    
    if (message.type === 'ai_response') {
        const messagesDiv = document.getElementById('ai-messages');
        messagesDiv.innerHTML += `
            <div class="mb-2 p-2 bg-green-100 rounded">
                <strong>AI:</strong> ${message.content}
            </div>
        `;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    } else if (message.type === 'player_chat') {
        const messagesDiv = document.getElementById('player-messages');
        messagesDiv.innerHTML += `
            <div class="mb-2 p-2 bg-blue-100 rounded">
                <strong>${message.sender}:</strong> ${message.content}
            </div>
        `;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
});

// 캐릭터 정보 표시
function showCharacter() {
    htmx.trigger('body', 'showCharacter');
}
</script>
</th:block>
</body>
</html>
