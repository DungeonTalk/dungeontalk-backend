<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>로그인 - DungeonTalk</title>
</head>
<body>
<div layout:fragment="content">
    <div class="min-h-[calc(100vh-128px)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full">
            <div class="bg-white dark:bg-gray-800 shadow-xl rounded-2xl p-8 space-y-6">
                <!-- Header -->
                <div class="text-center">
                    <div class="w-20 h-20 bg-gradient-to-br from-primary-500 to-secondary-500 rounded-2xl flex items-center justify-center mx-auto mb-4">
                        <span class="text-white text-4xl">🎲</span>
                    </div>
                    <h2 class="text-3xl font-bold text-gray-900 dark:text-white">던전톡에 오신 것을 환영합니다</h2>
                    <p class="mt-2 text-gray-600 dark:text-gray-400">계정에 로그인하여 모험을 시작하세요</p>
                </div>

                <!-- Login Form -->
                <div x-data="loginForm()" class="mt-8">
                    <!-- 서버 사이드 로그인 기본 사용 -->
                    <div th:if="${error}" class="mb-4 p-3 bg-red-100 dark:bg-red-900/20 border border-red-400 dark:border-red-800 text-red-700 dark:text-red-300 rounded-lg">
                        <span th:text="${error}"></span>
                    </div>
                    
                    <form action="/v1/auth/server-login"
                          method="post"
                          @submit="handleSubmit($event)" 
                          class="space-y-5">
                        <!-- User ID Input -->
                        <div>
                            <label for="userId" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                사용자 ID
                            </label>
                            <div class="relative">
                                <input type="text" 
                                       id="userId" 
                                       name="name"
                                       x-model="formData.userId"
                                       @input="clearError"
                                       class="appearance-none block w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:text-white transition-colors"
                                       placeholder="아이디를 입력하세요"
                                       :class="{'border-red-500 dark:border-red-500': errors.userId}"
                                       required>
                                <div x-show="errors.userId" class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                                    <svg class="h-5 w-5 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                                    </svg>
                                </div>
                            </div>
                            <p x-show="errors.userId" x-text="errors.userId" class="mt-1 text-sm text-red-600 dark:text-red-400"></p>
                        </div>

                        <!-- Password Input -->
                        <div>
                            <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                                비밀번호
                            </label>
                            <div class="relative">
                                <input :type="showPassword ? 'text' : 'password'" 
                                       id="password" 
                                       name="password"
                                       x-model="formData.password"
                                       @input="clearError"
                                       class="appearance-none block w-full px-4 py-3 pr-10 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:text-white transition-colors"
                                       placeholder="비밀번호를 입력하세요"
                                       :class="{'border-red-500 dark:border-red-500': errors.password}"
                                       required>
                                <button type="button"
                                        @click="showPassword = !showPassword"
                                        class="absolute inset-y-0 right-0 pr-3 flex items-center">
                                    <svg x-show="!showPassword" class="h-5 w-5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                    </svg>
                                    <svg x-show="showPassword" class="h-5 w-5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                                    </svg>
                                </button>
                            </div>
                            <p x-show="errors.password" x-text="errors.password" class="mt-1 text-sm text-red-600 dark:text-red-400"></p>
                        </div>

                        <!-- Remember Me & Forgot Password -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center">
                                <input id="remember-me" 
                                       x-model="formData.rememberMe"
                                       type="checkbox" 
                                       class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 dark:border-gray-600 rounded dark:bg-gray-700">
                                <label for="remember-me" class="ml-2 block text-sm text-gray-700 dark:text-gray-300">
                                    로그인 상태 유지
                                </label>
                            </div>
                            <a href="#" class="text-sm text-primary-600 hover:text-primary-500 dark:text-primary-400 dark:hover:text-primary-300">
                                비밀번호를 잊으셨나요?
                            </a>
                        </div>

                        <!-- Submit Button -->
                        <div>
                            <button type="submit" 
                                    :disabled="loading"
                                    class="group relative w-full flex justify-center py-3 px-4 border border-transparent rounded-lg text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 font-medium transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                                <span x-show="!loading" class="flex items-center">
                                    <svg class="w-5 h-5 mr-2 group-hover:rotate-12 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
                                    </svg>
                                    로그인
                                </span>
                                <span x-show="loading" class="flex items-center">
                                    <svg class="animate-spin h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                    로그인 중...
                                </span>
                            </button>
                        </div>
                    </form>

                    <!-- Register Link -->
                    <div class="mt-6">
                        <div class="relative">
                            <div class="absolute inset-0 flex items-center">
                                <div class="w-full border-t border-gray-300 dark:border-gray-600"></div>
                            </div>
                            <div class="relative flex justify-center text-sm">
                                <span class="px-4 bg-white dark:bg-gray-800 text-gray-500 dark:text-gray-400">또는</span>
                            </div>
                        </div>

                        <div class="mt-6 text-center">
                            <span class="text-gray-600 dark:text-gray-400">아직 계정이 없으신가요?</span>
                            <a href="#" @click.prevent="showRegisterModal = true" class="ml-2 font-medium text-primary-600 hover:text-primary-500 dark:text-primary-400 dark:hover:text-primary-300">
                                회원가입
                            </a>
                        </div>
                    </div>

                    <!-- Sample Accounts -->
                    <div class="mt-8 p-4 bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 rounded-lg">
                        <h3 class="text-sm font-medium text-blue-800 dark:text-blue-300 mb-2">
                            <svg class="w-4 h-4 inline mr-1" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                            </svg>
                            테스트 계정
                        </h3>
                        <div class="text-sm text-blue-700 dark:text-blue-300 space-y-1">
                            <div class="flex items-center cursor-pointer hover:text-blue-900 dark:hover:text-blue-100" 
                                 @click="fillCredentials('testuser1', 'password123')">
                                <code class="bg-blue-100 dark:bg-blue-800/30 px-2 py-0.5 rounded">testuser1 / password123</code>
                            </div>
                            <div class="flex items-center cursor-pointer hover:text-blue-900 dark:hover:text-blue-100" 
                                 @click="fillCredentials('testuser2', 'password123')">
                                <code class="bg-blue-100 dark:bg-blue-800/30 px-2 py-0.5 rounded">testuser2 / password123</code>
                            </div>
                            <div class="flex items-center cursor-pointer hover:text-blue-900 dark:hover:text-blue-100" 
                                 @click="fillCredentials('gm', 'gmpassword')">
                                <code class="bg-blue-100 dark:bg-blue-800/30 px-2 py-0.5 rounded">gm / gmpassword</code>
                            </div>
                        </div>
                    </div>

                    <!-- Register Modal -->
                    <div x-show="showRegisterModal" 
                         x-transition:enter="transition ease-out duration-300"
                         x-transition:enter-start="opacity-0"
                         x-transition:enter-end="opacity-100"
                         x-transition:leave="transition ease-in duration-200"
                         x-transition:leave-start="opacity-100"
                         x-transition:leave-end="opacity-0"
                         class="fixed inset-0 bg-black bg-opacity-50 overflow-y-auto h-full w-full z-50"
                         @click.self="showRegisterModal = false">
                        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-lg bg-white dark:bg-gray-800"
                             x-transition:enter="transition ease-out duration-300"
                             x-transition:enter-start="opacity-0 transform scale-90"
                             x-transition:enter-end="opacity-100 transform scale-100"
                             x-transition:leave="transition ease-in duration-200"
                             x-transition:leave-start="opacity-100 transform scale-100"
                             x-transition:leave-end="opacity-0 transform scale-90">
                            <div class="mt-3">
                                <h3 class="text-lg leading-6 font-medium text-gray-900 dark:text-white mb-4">회원가입</h3>
                                <form @submit.prevent="register" class="space-y-4">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">사용자 ID</label>
                                        <input type="text" 
                                               x-model="registerData.userId"
                                               class="appearance-none block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:text-white"
                                               required>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">닉네임</label>
                                        <input type="text" 
                                               x-model="registerData.nickname"
                                               class="appearance-none block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:text-white"
                                               placeholder="예: 용사님">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">비밀번호</label>
                                        <input type="password" 
                                               x-model="registerData.password"
                                               class="appearance-none block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:text-white"
                                               required>
                                    </div>
                                    <div class="flex justify-end space-x-3 mt-5">
                                        <button type="button" 
                                                @click="showRegisterModal = false"
                                                class="px-4 py-2 bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">
                                            취소
                                        </button>
                                        <button type="submit" 
                                                :disabled="registerLoading"
                                                class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors disabled:opacity-50">
                                            <span x-show="!registerLoading">가입하기</span>
                                            <span x-show="registerLoading">처리중...</span>
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
<script>
// 페이지 로드 시 남은 쿠키 정리
document.addEventListener('DOMContentLoaded', function() {
    // 로그인 페이지에 도착했다면 인증 관련 쿠키 삭제
    document.cookie = 'accessToken=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC;';
    document.cookie = 'refreshToken=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC;';
    document.cookie = 'userInfo=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC;';
    
    // localStorage도 정리
    localStorage.removeItem('authToken');
    localStorage.removeItem('currentUser');
});

function loginForm() {
    return {
        formData: {
            userId: '',
            password: '',
            rememberMe: false
        },
        registerData: {
            userId: '',
            nickname: '',
            password: ''
        },
        showPassword: false,
        loading: false,
        registerLoading: false,
        showRegisterModal: false,
        useServerLogin: true, // 서버 사이드 로그인 고정
        errors: {},
        
        fillCredentials(userId, password) {
            this.formData.userId = userId;
            this.formData.password = password;
            this.clearError();
        },
        
        clearError() {
            this.errors = {};
        },
        
        handleSubmit(event) {
            // 서버 사이드 로그인 사용 시 폼 제출
            if (this.useServerLogin) {
                this.loading = true;
                // 폼이 정상적으로 제출되도록 함
                return true;
            }
            
            // 클라이언트 사이드 로그인 (백업용)
            event.preventDefault();
            this.clientLogin();
        },
        
        async clientLogin() {
            // 클라이언트 사이드 로그인 로직 (백업용)
            this.loading = true;
            this.errors = {};
            
            try {
                const response = await fetch('/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: this.formData.userId,
                        password: this.formData.password
                    })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || '로그인에 실패했습니다.');
                }
                
                const result = await response.json();
                const data = result.data || result;
                
                // 토큰을 localStorage에 저장 (클라이언트 사이드)
                localStorage.setItem('authToken', data.accessToken);
                localStorage.setItem('currentUser', JSON.stringify({
                    id: data.memberId || this.formData.userId,
                    nickname: this.formData.userId + '님'
                }));
                
                // 성공 알림
                Alpine.store('notifications').success('로그인에 성공했습니다! 잠시 후 이동합니다.');
                
                // 페이지 이동
                setTimeout(() => {
                    window.location.href = '/game';
                }, 1000);
                
            } catch (error) {
                console.error('로그인 오류:', error);
                this.errors.general = error.message || '로그인 중 오류가 발생했습니다.';
                Alpine.store('notifications').error(this.errors.general);
            } finally {
                this.loading = false;
            }
        },
        
        async register() {
            this.registerLoading = true;
            
            try {
                const response = await fetch('/v1/member/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: this.registerData.userId,
                        nickName: this.registerData.nickname || this.registerData.userId + '님',
                        password: this.registerData.password
                    })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || '회원가입에 실패했습니다.');
                }
                
                // 성공
                Alpine.store('notifications').success('회원가입이 완료되었습니다! 로그인해주세요.');
                this.showRegisterModal = false;
                
                // 로그인 폼에 아이디 자동 입력
                this.formData.userId = this.registerData.userId;
                this.registerData = { userId: '', nickname: '', password: '' };
                
            } catch (error) {
                console.error('회원가입 오류:', error);
                Alpine.store('notifications').error(error.message || '회원가입 중 오류가 발생했습니다.');
            } finally {
                this.registerLoading = false;
            }
        }
    }
}
</script>
</th:block>
</body>
</html>
