<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <!-- Reusable header fragment -->
    <th:block th:fragment="header">
        <nav class="bg-white dark:bg-gray-800 shadow-lg sticky top-0 z-50" x-data="{ mobileMenuOpen: false }">
            <div class="container mx-auto px-4">
                <div class="flex justify-between items-center h-16">
                    <!-- Logo -->
                    <div class="flex items-center">
                        <a href="/" class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-gradient-to-br from-primary-500 to-secondary-500 rounded-lg flex items-center justify-center">
                                <span class="text-white font-bold text-xl">D</span>
                            </div>
                            <span class="font-bold text-xl">DungeonTalk</span>
                        </a>
                    </div>
                    
                    <!-- Desktop Navigation -->
                    <div class="hidden md:flex items-center space-x-8">
                        <a href="/" class="hover:text-primary-600 dark:hover:text-primary-400 transition-colors">홈</a>
                        <a href="/chat" class="hover:text-primary-600 dark:hover:text-primary-400 transition-colors">채팅</a>
                        
                        <div class="flex items-center space-x-4">
                            <!-- Dark mode toggle -->
                            <button @click="document.documentElement.classList.toggle('dark')" 
                                    class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                                <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                          d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                                </svg>
                                <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                          d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                                </svg>
                            </button>
                            
                            <!-- User menu -->
                            <div class="relative" x-data="{ userMenuOpen: false }" sec:authorize="isAuthenticated()">
                                <button @click="userMenuOpen = !userMenuOpen" 
                                        class="flex items-center space-x-2 p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                                    <div class="w-8 h-8 bg-gradient-to-br from-primary-400 to-secondary-400 rounded-full flex items-center justify-center">
                                        <span class="text-white text-sm font-semibold" sec:authentication="principal">U</span>
                                    </div>
                                    <span class="text-sm font-medium" sec:authentication="principal">사용자</span>
                                </button>
                                
                                <div x-show="userMenuOpen" 
                                     @click.away="userMenuOpen = false"
                                     x-transition:enter="transition ease-out duration-100"
                                     x-transition:enter-start="transform opacity-0 scale-95"
                                     x-transition:enter-end="transform opacity-100 scale-100"
                                     x-transition:leave="transition ease-in duration-75"
                                     x-transition:leave-start="transform opacity-100 scale-100"
                                     x-transition:leave-end="transform opacity-0 scale-95"
                                     x-cloak
                                     class="absolute right-0 mt-2 w-48 rounded-lg shadow-lg bg-white dark:bg-gray-800 ring-1 ring-black ring-opacity-5">
                                    <div class="py-1">
                                        <a href="/profile" class="block px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-700">프로필</a>
                                        <a href="/settings" class="block px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-700">설정</a>
                                        <hr class="my-1 border-gray-200 dark:border-gray-700">
                                        <form action="/v1/auth/server-logout" method="post" class="inline-block w-full">
                                            <button type="submit" class="block w-full text-left px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-700">로그아웃</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Login button for guests -->
                            <a sec:authorize="!isAuthenticated()" 
                               href="/login" 
                               class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors">
                                로그인
                            </a>
                        </div>
                    </div>
                    
                    <!-- Mobile menu button -->
                    <button @click="mobileMenuOpen = !mobileMenuOpen" 
                            class="md:hidden p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path x-show="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                            <path x-show="mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- Mobile menu -->
            <div x-show="mobileMenuOpen" 
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 -translate-y-2"
                 x-transition:enter-end="opacity-100 translate-y-0"
                 x-transition:leave="transition ease-in duration-150"
                 x-transition:leave-start="opacity-100 translate-y-0"
                 x-transition:leave-end="opacity-0 -translate-y-2"
                 x-cloak
                 class="md:hidden bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700">
                <div class="px-4 py-2 space-y-1">
                    <a href="/" class="block py-2 hover:text-primary-600 dark:hover:text-primary-400">홈</a>
                    <a href="/chat" class="block py-2 hover:text-primary-600 dark:hover:text-primary-400">채팅</a>
                    <div sec:authorize="isAuthenticated()" class="pt-2 border-t border-gray-200 dark:border-gray-700">
                        <a href="/profile" class="block py-2 hover:text-primary-600 dark:hover:text-primary-400">프로필</a>
                        <a href="/settings" class="block py-2 hover:text-primary-600 dark:hover:text-primary-400">설정</a>
                        <form action="/v1/auth/server-logout" method="post" class="inline-block w-full">
                            <button type="submit" class="block w-full text-left py-2 hover:text-primary-600 dark:hover:text-primary-400">로그아웃</button>
                        </form>
                    </div>
                    <div sec:authorize="!isAuthenticated()" class="pt-2">
                        <a href="/login" class="block py-2 text-primary-600 font-medium">로그인</a>
                    </div>
                </div>
            </div>
        </nav>
    </th:block>
</body>
</html>
