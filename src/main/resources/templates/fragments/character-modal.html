<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Character Creation Modal Fragment -->
<div th:fragment="character-modal" x-show="showCharacterModal" 
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-50 overflow-y-auto"
     style="display: none;">
    <div class="flex items-center justify-center min-h-screen px-4">
        <div class="fixed inset-0 bg-black opacity-50" @click="showCharacterModal = false"></div>
        
        <div class="relative bg-white dark:bg-gray-800 rounded-lg max-w-2xl w-full p-6 z-10">
            <h3 class="text-2xl font-bold mb-4">🧙‍♂️ 캐릭터 생성</h3>
            
            <div class="mb-6">
                <label class="block text-sm font-medium mb-2">종족 선택</label>
                <select x-model="selectedRace" 
                        @change="updateRaceDescription()"
                        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 dark:bg-gray-700">
                    <option value="">종족을 선택하세요...</option>
                    <option value="HUMAN">인간 - 균형잡힌 능력치</option>
                    <option value="ELF">엘프 - 민첩과 지혜</option>
                    <option value="DWARF">드워프 - 강인한 체력</option>
                    <option value="ORC">오크 - 강력한 힘</option>
                </select>
            </div>
            
            <div x-show="selectedRace" class="mb-6 p-4 bg-gray-50 dark:bg-gray-700 rounded-lg">
                <h4 class="font-semibold mb-2">종족 특성</h4>
                <p x-text="raceDescription" class="text-sm text-gray-600 dark:text-gray-300"></p>
            </div>
            
            <div class="flex justify-end gap-3">
                <button @click="showCharacterModal = false"
                        class="px-6 py-2 bg-gray-500 hover:bg-gray-600 text-white rounded-lg transition-colors">
                    취소
                </button>
                <button @click="createCharacter()"
                        :disabled="!selectedRace"
                        class="px-6 py-2 bg-primary-600 hover:bg-primary-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white rounded-lg transition-colors">
                    캐릭터 생성
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Character Info Modal Fragment -->
<div th:fragment="character-info" x-show="showCharacterInfo" 
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-50 overflow-y-auto"
     style="display: none;">
    <div class="flex items-center justify-center min-h-screen px-4">
        <div class="fixed inset-0 bg-black opacity-50" @click="showCharacterInfo = false"></div>
        
        <div class="relative bg-white dark:bg-gray-800 rounded-lg max-w-3xl w-full p-6 z-10">
            <h3 class="text-2xl font-bold mb-4">⚔️ 내 캐릭터</h3>
            
            <div x-show="!characterData" class="text-center py-12">
                <div class="text-6xl mb-4">🎭</div>
                <p class="text-lg text-gray-600 dark:text-gray-400">캐릭터가 없습니다</p>
                <button @click="showCharacterInfo = false; showCharacterModal = true"
                        class="mt-4 px-6 py-2 bg-primary-600 hover:bg-primary-700 text-white rounded-lg transition-colors">
                    캐릭터 생성하기
                </button>
            </div>
            
            <div x-show="characterData" class="space-y-6">
                <!-- Basic Info -->
                <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4">
                    <h4 class="font-semibold mb-3">📋 기본 정보</h4>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <span class="text-sm text-gray-600 dark:text-gray-400">종족:</span>
                            <span class="ml-2 font-medium" x-text="characterData?.race || '-'"></span>
                        </div>
                        <div>
                            <span class="text-sm text-gray-600 dark:text-gray-400">레벨:</span>
                            <span class="ml-2 font-medium" x-text="characterData?.level || 1"></span>
                        </div>
                        <div>
                            <span class="text-sm text-gray-600 dark:text-gray-400">경험치:</span>
                            <span class="ml-2 font-medium" x-text="`${characterData?.exp || 0} / ${characterData?.maxExp || 100}`"></span>
                        </div>
                        <div>
                            <span class="text-sm text-gray-600 dark:text-gray-400">생성일:</span>
                            <span class="ml-2 font-medium" x-text="characterData?.createdAt || '-'"></span>
                        </div>
                    </div>
                </div>
                
                <!-- Stats -->
                <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4">
                    <h4 class="font-semibold mb-3">📊 능력치</h4>
                    <div class="grid grid-cols-3 gap-4">
                        <div class="text-center">
                            <div class="text-2xl font-bold text-red-500" x-text="characterData?.str || 10">10</div>
                            <div class="text-sm text-gray-600 dark:text-gray-400">STR (힘)</div>
                        </div>
                        <div class="text-center">
                            <div class="text-2xl font-bold text-blue-500" x-text="characterData?.wil || 10">10</div>
                            <div class="text-sm text-gray-600 dark:text-gray-400">WIL (의지)</div>
                        </div>
                        <div class="text-center">
                            <div class="text-2xl font-bold text-purple-500" x-text="characterData?.int || 10">10</div>
                            <div class="text-sm text-gray-600 dark:text-gray-400">INT (지능)</div>
                        </div>
                        <div class="text-center">
                            <div class="text-2xl font-bold text-green-500" x-text="characterData?.wis || 10">10</div>
                            <div class="text-sm text-gray-600 dark:text-gray-400">WIS (지혜)</div>
                        </div>
                        <div class="text-center">
                            <div class="text-2xl font-bold text-yellow-500" x-text="characterData?.dex || 10">10</div>
                            <div class="text-sm text-gray-600 dark:text-gray-400">DEX (민첩)</div>
                        </div>
                        <div class="text-center">
                            <div class="text-2xl font-bold text-pink-500" x-text="characterData?.luk || 10">10</div>
                            <div class="text-sm text-gray-600 dark:text-gray-400">LUK (행운)</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="flex justify-end mt-6">
                <button @click="showCharacterInfo = false"
                        class="px-6 py-2 bg-gray-500 hover:bg-gray-600 text-white rounded-lg transition-colors">
                    닫기
                </button>
            </div>
        </div>
    </div>
</div>

</html>
