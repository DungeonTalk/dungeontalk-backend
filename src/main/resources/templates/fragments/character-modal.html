<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Character Creation Modal Fragment -->
<div th:fragment="character-modal" x-show="showCharacterModal" 
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-50 overflow-y-auto"
     style="display: none;">
    <div class="flex items-center justify-center min-h-screen px-4">
        <div class="fixed inset-0 bg-black opacity-50" @click="showCharacterModal = false"></div>
        
        <div class="relative bg-white dark:bg-gray-800 rounded-lg max-w-2xl w-full p-6 z-10">
            <h3 class="text-2xl font-bold mb-4">🧙‍♂️ 캐릭터 생성</h3>
            
            <div class="mb-6">
                <label class="block text-sm font-medium mb-2">종족 선택</label>
                <select x-model="selectedRace" 
                        @change="updateRaceDescription()"
                        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 dark:bg-gray-700">
                    <option value="">종족을 선택하세요...</option>
                    <option value="HUMAN">인간 - 균형잡힌 능력치</option>
                    <option value="ELF">엘프 - 민첩과 지혜</option>
                    <option value="DWARF">드워프 - 강인한 체력</option>
                    <option value="ORC">오크 - 강력한 힘</option>
                </select>
            </div>
            
            <div x-show="selectedRace" class="mb-6 p-4 bg-gray-50 dark:bg-gray-700 rounded-lg">
                <h4 class="font-semibold mb-2">종족 특성</h4>
                <p x-text="raceDescription" class="text-sm text-gray-600 dark:text-gray-300"></p>
            </div>
            
            <div class="flex justify-end gap-3">
                <button @click="showCharacterModal = false"
                        class="px-6 py-2 bg-gray-500 hover:bg-gray-600 text-white rounded-lg transition-colors">
                    취소
                </button>
                <button @click="createCharacter()"
                        :disabled="!selectedRace"
                        class="px-6 py-2 bg-primary-600 hover:bg-primary-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white rounded-lg transition-colors">
                    캐릭터 생성
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Character Info Modal Fragment -->
<div th:fragment="character-info" x-show="showCharacterInfo" 
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-50 overflow-y-auto"
     style="display: none;">
    <div class="flex items-center justify-center min-h-screen px-4">
        <div class="fixed inset-0 bg-black opacity-50" @click="showCharacterInfo = false"></div>
        
        <div class="relative bg-white dark:bg-gray-800 rounded-lg max-w-4xl w-full max-h-[90vh] overflow-y-auto p-6 z-10">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-2xl font-bold">⚔️ 내 캐릭터</h3>
                <button @click="showCharacterInfo = false" 
                        class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <!-- Character Info Content loaded via HTMX -->
            <div id="character-modal-content"
                 hx-get="/game/character/info"
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <div class="text-center py-8">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-primary-500"></div>
                    <p class="mt-2 text-gray-500">캐릭터 정보 로딩 중...</p>
                </div>
            </div>
            
            <div class="flex justify-end mt-6 gap-3">
                <button @click="refreshCharacterInfo()"
                        class="px-6 py-2 bg-primary-600 hover:bg-primary-700 text-white rounded-lg transition-colors">
                    🔄 새로고침
                </button>
                <button @click="showCharacterInfo = false"
                        class="px-6 py-2 bg-gray-500 hover:bg-gray-600 text-white rounded-lg transition-colors">
                    닫기
                </button>
            </div>
        </div>
    </div>
</div>

</html>
